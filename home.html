<!DOCTYPE html>
<html lang="en">
<head>
    <title>TRAGO</title>

    <link rel="stylesheet" href="home.css">
</head>

<body>

    <main class="home">

        <div class="content">

            <div class="logo">L</div>

            <p class="welcome">WELCOME TO TRAGO</p>

            <h1>
                Learn a Language.<br>
                <span>Open a New World.</span>
            </h1>

            <p class="description">
                Hello, Language Learner! 👋<br>
                Start your learning journey and build your skills step by step.
            </p>

            <div class="buttons">

                <button class="login-btn" onclick="login()">
                    Login
                </button>

                <button class="signup-btn" onclick="signup()">
                    Sign Up
                </button>

            </div>

            <p class="bottom-text">
                Your language journey starts here ✦
            </p>

        </div>

    </main>

    <script>
        function login() {
            window.location.href = "login.html";
        }

        function signup() {
            window.location.href = "signup.html";
        }
    </script>

</body>
</html>
