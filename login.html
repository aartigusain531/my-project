<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRAGO - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-card">

        <div class="logo">L</div>
    
        <h1>Welcome Back!</h1>
    
        <p class="subtitle">
            Continue your language learning journey
        </p>
    
        <form id="loginForm">
    
            <!-- Name -->
            <div class="input-box">
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your Name"
                    autocomplete="name"
                    required>
            </div>
    
            <!-- Email -->
            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email Address"
                    autocomplete="email"
                    required>
            </div>
    
            <!-- Password -->
            <div class="input-box">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required>
            </div>
    
            <button type="submit">
                Login
            </button>
    
            <p class="forgot">
                <a href="#">Forgot Password?</a>
            </p>
    
            <p class="signup">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>
    
            <p class="home-link">
                <a href="home.html">← Back to Home</a>
            </p>
    
        </form>
    
    </div>
