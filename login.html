<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRAGO - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="container">

    <div class="login-card">

        <div class="logo">L</div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Continue your language learning journey
        </p>

        <form id="loginForm">

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

            <p class="forgot">
                <a href="#">Forgot Password?</a>
            </p>

            <p class="signup">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

            <p class="home-link">
                <a href="home.html">← Back to Home</a>
            </p>

        </form>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
