<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRAGO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #f8d8ff,
                #e8d9ff,
                #d9e7ff
            );
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .splash {
            text-align: center;
            animation: fadeIn 1.2s ease;
        }

        .logo {
            width: 110px;
            height: 110px;
            margin: auto;
            border-radius: 30px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #d946ef,
                #8b5cf6,
                #6366f1
            );

            color: white;
            font-size: 55px;
            font-weight: bold;

            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.3);

            animation: logoPop 1s ease;
        }

        .title {
            margin-top: 25px;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 4px;

            background: linear-gradient(
                90deg,
                #d946ef,
                #8b5cf6,
                #6366f1
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            margin-top: 8px;
            color: #666;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .loader {
            width: 45px;
            height: 45px;
            margin: 35px auto 0;

            border: 4px solid rgba(139, 92, 246, 0.2);
            border-top: 4px solid #8b5cf6;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes logoPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <main class="splash">

        <div class="logo">
            T
        </div>

        <h1 class="title">
            TRAGO
        </h1>

        <p class="tagline">
            Learn a Language. Open a New World.
        </p>

        <div class="loader"></div>

    </main>

    <script>
        setTimeout(function () {
            window.location.href = "home.html";
        }, 2500);
    </script>

</body>
</html>
