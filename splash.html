<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRAGO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 20%, #ffd6ec 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #f3c4ff 0%, transparent 35%),
                linear-gradient(135deg, #fff0f7, #fce4f2, #f4ddff);

            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Decorative circles */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.45;
        }

        body::before {
            width: 180px;
            height: 180px;
            background: #ff9dcc;
            top: -70px;
            left: -60px;
        }

        body::after {
            width: 220px;
            height: 220px;
            background: #dca7ff;
            bottom: -100px;
            right: -80px;
        }

        .splash {
            text-align: center;
            position: relative;
            z-index: 2;

            animation: fadeIn 1s ease;
        }

        /* LOGO */
        .logo {
            width: 125px;
            height: 125px;
            margin: auto;

            border-radius: 38px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                145deg,
                #ff4f9a,
                #f472b6,
                #d946ef
            );

            color: white;

            font-size: 58px;
            font-weight: 800;

            box-shadow:
                0 18px 45px rgba(236, 72, 153, 0.30),
                0 0 35px rgba(244, 114, 182, 0.25);

            animation: logoPop 1s ease;
        }

        /* Small shine on logo */
        .logo::after {
            content: "";
            position: absolute;
            width: 125px;
            height: 125px;
            border-radius: 38px;

            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.35),
                transparent 45%
            );

            pointer-events: none;
        }

        /* TITLE */
        .title {
            margin-top: 25px;

            font-size: 44px;
            font-weight: 800;
            letter-spacing: 5px;

            background: linear-gradient(
                90deg,
                #ec4899,
                #db2777,
                #c026d3
            );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        /* TAGLINE */
        .tagline {
            margin-top: 9px;

            color: #8b5b75;

            font-size: 15px;
            letter-spacing: 0.8px;
        }

        /* LOADER */
        .loader {
            width: 42px;
            height: 42px;

            margin: 32px auto 0;

            border: 4px solid rgba(236, 72, 153, 0.18);
            border-top: 4px solid #ec4899;

            border-radius: 50%;

            animation: spin 0.9s linear infinite;
        }

        /* Loading text */
        .loading-text {
            margin-top: 12px;

            font-size: 12px;
            color: #a25b7d;

            letter-spacing: 1.5px;
        }

        /* FADE */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LOGO POP */
        @keyframes logoPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            60% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* LOADER */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="splash">

        <div class="logo">
            T
        </div>

        <h1 class="title">
            TRAGO
        </h1>

        <p class="tagline">
            Learn a Language. Open a New World.
        </p>

        <div class="loader"></div>

        <p class="loading-text">
            LOADING...
        </p>

    </main>

    <script>
        setTimeout(function () {
            window.location.href = "home.html";
        }, 2500);
    </script>

</body>
</html>
